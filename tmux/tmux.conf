# ============================================================
# TMUX CONFIG — MATRIX GREEN
# To apply: tmux kill-server && tmux new-session -s work
# First run: prefix + I to install plugins via TPM
# ============================================================

# ── CORE ──────────────────────────────────────────────────
# Prefix key: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Windows start at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Scrollback
set -g history-limit 100000

# No delay after Esc (important for Neovim)
set -g escape-time 0

# Faster key repeat
set -g repeat-time 400

# Let Neovim detect focus changes
set -g focus-events on

# Enable clipboard integration (macOS)
set -g set-clipboard on

# ── TERMINAL & COLORS ────────────────────────────────────
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
# Undercurl support (for Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Block cursor always (prevent programs from changing it)
set -g cursor-style block
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# ── WINDOWS & PANES ──────────────────────────────────────
# New windows/splits open in same directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Intuitive split shortcuts: | for horizontal, - for vertical
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── PANE NAVIGATION ──────────────────────────────────────
# Ctrl-a then h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: Ctrl-a then H/J/K/L (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ── VIM-TMUX-NAVIGATOR ───────────────────────────────────
# Seamless <C-h/j/k/l> across nvim splits and tmux panes.
# When the active pane is nvim, the keys are forwarded to it; otherwise
# tmux moves between panes. Required by christoomey/vim-tmux-navigator
# on the nvim side (see ~/.config/nvim/lua/custom/plugins/tmux-navigator.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Same bindings while inside copy-mode so muscle memory survives
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Toggle zoom on current pane
bind z resize-pane -Z

# Quick toggle last window / last session
bind Space last-window
bind S switch-client -l

# ── COPY MODE (vim-style + macOS clipboard) ───────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer

# ── SESSION MANAGEMENT ────────────────────────────────────
# Create new session from within tmux
bind N new-session -c ~
# Kill pane without confirm
bind x kill-pane
# Kill window without confirm
bind X kill-window

# ── RELOAD ────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "[ config reloaded ]"


# ── PLUGINS (TPM) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
  
# Session persistence: survives server kill/restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: save/restore pane contents and neovim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── PALETTE ───────────────────────────────────────────────
# bg:          #0d0d0d  (deep black)
# bg_bar:      #0a0a0a  (bar background)
# fg:          #33ff33  (matrix green — primary)
# fg_dim:      #1a8c1a  (dimmed green)
# green_bright:#00ff41  (neon green — accents)
# green_mid:   #39ff14  (electric green)
# green_dark:  #0d5e0d  (muted green)
# cyan:        #00ffcc  (highlight)
# yellow:      #ccff00  (active/alert)

# ── STATUS BAR ────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status 2

# Deep dark bar
set -g status-style "bg=#0a0a0a,fg=#33ff33"

# ── ROW 1 (top): windows ─────────────────────────────────
# Left: session with neon pill
set -g status-left "#[fg=#0a0a0a,bg=#00ff41,bold]  #S #[fg=#00ff41,bg=#0a0a0a] "
set -g status-left-length 35

# Right: matrix rain + clock
set -g status-right "#[fg=#0d5e0d]#(~/.config/tmux/matrix-rain.sh) #[fg=#0d5e0d]│ #[fg=#33ff33]%d %b #[fg=#0d5e0d]│ #[fg=#00ff41,bold]%H:%M "
set -g status-right-length 80

# Inactive windows: dim green
set -g window-status-format "#[fg=#33ff33,bg=#0a0a0a] #I:#W "

# Active window: bright neon block
set -g window-status-current-format "#[fg=#0a0a0a,bg=#00ff41,bold] #I:#W #[fg=#00ff41,bg=#0a0a0a]"

set -g window-status-separator "|"

# ── ROW 2 (bottom): system info + git ────────────────────
set -g status-format[1] "#[align=left,bg=#0a0a0a]#[fg=#0d5e0d] #[fg=#1a8c1a]#{pane_current_path} #[fg=#0d5e0d]│ #[fg=#00ffcc]󰘬 #(cd #{pane_current_path} && git branch --show-current 2>/dev/null || echo '-') #[fg=#0d5e0d]│ #[fg=#1a8c1a]󰊠 #{pane_current_command}#[align=right]#[fg=#1a8c1a]#(~/.config/tmux/sysstat.sh) #[fg=#0d5e0d]│ #[fg=#33ff33]󰍛 #(vm_stat | awk '/Pages active/{gsub(/\\./,\"\"); printf \"%.0fM\", $3*16384/1048576}') "

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#ccff00,bg=#0a0a0a"

# ── THEME SWITCHER ────────────────────────────────────────
# prefix + T → pick theme from fzf popup
bind T run-shell "~/.config/tmux/tmux-theme.sh menu"
# prefix + t → cycle to next theme
bind t run-shell "~/.config/tmux/tmux-theme.sh next"

# ── PANE BORDERS ──────────────────────────────────────────
set -g pane-border-lines single
set -g pane-border-style "fg=#0d5e0d"
set -g pane-active-border-style "fg=#00ff41"
set -g pane-border-status off

# ── MESSAGES & PROMPTS ────────────────────────────────────
set -g message-style "bg=#0a0a0a,fg=#00ff41,bold"
set -g message-command-style "bg=#0a0a0a,fg=#00ffcc"

# ── COPY MODE HIGHLIGHT ──────────────────────────────────
setw -g mode-style "bg=#0d5e0d,fg=#33ff33"

# ── CLOCK ─────────────────────────────────────────────────
set -g clock-mode-colour "#00ff41"
set -g clock-mode-style 24

# ── POPUP & DISPLAY ──────────────────────────────────────
set -g display-time 2000
set -g display-panes-time 2000
set -g display-panes-colour "#0d5e0d"
set -g display-panes-active-colour "#00ff41"

# ── TPM INIT (must be last) ──────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# Direct plugin init (fallback if TPM doesn't load them)
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.tmux/plugins/tmux-continuum/continuum.tmux'
