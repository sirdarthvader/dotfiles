# ============================================================
# TMUX CONFIG — TOKYONIGHT NIGHT
# To apply: prefix + r (or: tmux kill-server && t)
# First run: prefix + I to install plugins via TPM
# ============================================================

# ── CORE ──────────────────────────────────────────────────
# Prefix key: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# Windows start at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Scrollback
set -g history-limit 100000

# No delay after Esc (important for Neovim)
set -g escape-time 0

# Faster key repeat
set -g repeat-time 400

# Let Neovim detect focus changes
set -g focus-events on

# Pass modified keys (Ctrl+Enter, Shift+Enter) through to nvim / Claude Code
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Let nvim (snacks.image) draw images/diagrams through tmux to Ghostty
set -g allow-passthrough on

# Enable clipboard integration (macOS)
set -g set-clipboard on

# ── TERMINAL & COLORS ────────────────────────────────────
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
# Undercurl support (for Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Block cursor always (prevent programs from changing it)
set -g cursor-style block
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# ── WINDOWS & PANES ──────────────────────────────────────
# New windows/splits open in same directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Intuitive split shortcuts: | for horizontal, - for vertical
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── PANE NAVIGATION ──────────────────────────────────────
# Ctrl-a then h/j/k/l to move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes: Ctrl-a then H/J/K/L (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ── VIM-TMUX-NAVIGATOR ───────────────────────────────────
# Seamless <C-h/j/k/l> across nvim splits and tmux panes.
# When the active pane is nvim, the keys are forwarded to it; otherwise
# tmux moves between panes. Required by christoomey/vim-tmux-navigator
# on the nvim side (see nvim/lua/plugins/tmux-navigator.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Same bindings while inside copy-mode so muscle memory survives
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Toggle zoom on current pane
bind z resize-pane -Z

# Quick toggle last window / last session
bind Space last-window
bind S switch-client -l

# ── COPY MODE (vim-style + macOS clipboard) ───────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer

# ── SESSION MANAGEMENT ────────────────────────────────────
# Fuzzy-pick a project and switch to (or create) its session
bind f display-popup -E -w 70% -h 60% "~/.config/tmux/sessionizer.sh"
# Scratch shell for this project in a popup; same key hides it (Ghostty maps Ctrl+` to this)
bind t run-shell -b "~/.config/tmux/popup.sh '#{session_name}' '#{pane_current_path}' '#{client_name}'"
# Queue the next Ghostty background image (Ghostty maps Cmd+Shift+B to reload + this)
bind B run-shell -b "~/.config/ghostty/shuffle-bg.sh"
# Lazygit in a popup for the current pane's directory
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
# Create new session from within tmux
bind N new-session -c ~
# Kill pane without confirm
bind x kill-pane
# Kill window without confirm
bind X kill-window

# ── AI (claude / copilot) ─────────────────────────────────
# prefix a: toggle a Claude pane on the right of this window (hidden, not killed)
bind a run-shell "~/.config/tmux/ai.sh toggle '#{pane_id}'"
# prefix W: move the AI pane into its own "ai" window and back (same conversation)
bind W run-shell "~/.config/tmux/ai.sh pop '#{pane_id}'"
# prefix A: pick tool / continue / resume for this window's AI pane
bind A display-popup -E -w 40% -h 30% "~/.config/tmux/ai.sh pick"
# @ai_alert is set by ai-notify.sh (Claude hook); clear it once you look at the window
set-hook -g session-window-changed 'set -wu @ai_alert'
set-hook -g client-session-changed 'set -wu @ai_alert'

# ── RELOAD ────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "[ config reloaded ]"


# ── PLUGINS (TPM) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
  
# Session persistence: survives server kill/restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: save/restore pane contents (reopen nvim buffers with <leader>qs)
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── PALETTE (Tokyonight Night) ─────────────────────────────
# bg:          #1a1b26  (base)
# bg_bar:      #16161e  (bar background)
# fg:          #c0caf5  (primary text)
# fg_dim:      #565f89  (dimmed/comment)
# blue:        #7aa2f7  (accent — active)
# green:       #9ece6a  (session/added)
# cyan:        #7dcfff  (highlight)
# yellow:      #e0af68  (active/alert)
# red:         #f7768e  (error/deleted)
# purple:      #bb9af7  (magenta accent)

# ── STATUS BAR ────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status on

# Deep dark bar
set -g status-style "bg=#16161e,fg=#c0caf5"

# Left: session pill (turns yellow while the prefix is pressed)
set -g status-left "#[fg=#16161e,bg=#{?client_prefix,#e0af68,#9ece6a},bold]  #S #[fg=#{?client_prefix,#e0af68,#9ece6a},bg=#16161e] "
set -g status-left-length 35

# Right: other sessions with an AI waiting/finished, then date + clock
set -g status-right "#{S:#{?session_attached,,#{?#{W:#{?@ai_alert,1,}},#[fg=#e0af68]● #{session_name} ,}}}#[fg=#c0caf5]%d %b #[fg=#565f89]│ #[fg=#7aa2f7,bold]%H:%M "
set -g status-right-length 80

# Inactive windows: dim (+ yellow AI marker: ● needs input, ✓ finished)
set -g window-status-format "#[fg=#565f89,bg=#16161e] #I:#W #{?@ai_alert,#[fg=#e0af68]#{@ai_alert} ,}"

# Active window: accent block
set -g window-status-current-format "#[fg=#16161e,bg=#7aa2f7,bold] #I:#W #[fg=#7aa2f7,bg=#16161e]"

set -g window-status-separator "|"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#e0af68,bg=#16161e"

# ── PANE BORDERS ──────────────────────────────────────────
set -g pane-border-lines single
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status off

# ── MESSAGES & PROMPTS ────────────────────────────────────
set -g message-style "bg=#16161e,fg=#7aa2f7,bold"
set -g message-command-style "bg=#16161e,fg=#7dcfff"

# ── COPY MODE HIGHLIGHT ──────────────────────────────────
setw -g mode-style "bg=#283457,fg=#c0caf5"

# ── CLOCK ────────────────────────────────────────────────
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# ── POPUP & DISPLAY ──────────────────────────────────────
set -g display-time 2000
set -g display-panes-time 2000
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

# ── TPM INIT (must be last) ──────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
